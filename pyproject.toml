[project]
name = "cat-mcp"
version = "1.0.0"
description = "Cat — Remote software engineering workspace MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Cat Contributors" },
]
keywords = ["mcp", "filesystem", "remote-workspace", "ai-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=2.3.0rc1,<3.0.0",
    "pydantic>=2.0",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/username/cat"
Source = "https://github.com/username/cat"
Issues = "https://github.com/username/cat/issues"

[project.scripts]
cat-mcp = "cat_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
